# Runs on every push to main and every pull request: type-check, tests, and a production build.
# It needs no secrets, so it is safe to run on pull requests from forks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Tests (rules, physics, AI, replay, and a real server)
        run: npm test

      - name: Build
        run: npm run build

      # A build can pass every check above and still show a blank page (for example after a bad dependency
      # upgrade). This starts the built app and loads it in a real browser.
      - name: Smoke test (does the built app really start?)
        run: |
          PORT=3100 npm start > server.log 2>&1 &
          for i in $(seq 1 40); do curl -sf http://localhost:3100/api/health > /dev/null && break; sleep 1; done
          npm run smoke -w client -- http://localhost:3100/
